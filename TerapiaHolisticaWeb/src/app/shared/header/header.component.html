<header class="site-header">

  <div class="header-container">

    <!-- LOGO / NOMBRE DE LA EMPRESA -->
    <a
      routerLink="/"
      class="brand"
      (click)="closeMenu()"
    >
      <div class="brand-name">
        Nora Sanchez
      </div>

      <div class="brand-subtitle">
        Terapeuta Holística MZT
      </div>
    </a>


    <!-- BOTÓN MENÚ MOBILE -->
    <button
      class="menu-toggle"
      type="button"
      aria-label="Abrir menú"
      [attr.aria-expanded]="menuOpen"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>


    <!-- MENÚ -->
    <nav
      class="main-nav"
      [class.menu-open]="menuOpen"
    >

      <a
  href="#inicio"
  (click)="scrollTo('inicio')"
>
  Inicio
</a>

<a
  href="#sobre-mi"
  (click)="scrollTo('sobre-mi')"
>
  Sobre Mí
</a>

      <a
        routerLink="/servicios"
        (click)="closeMenu()"
        href="#servicios"
      >
        Servicios
      </a>

      <a
        routerLink="/galeria"
        (click)="closeMenu()"
        href="#galeria"
      >
        Galería
      </a>

      <a
        routerLink="/testimonios"
        (click)="closeMenu()"
        href="#testimonios"
      >
        Reseñas
      </a>

      <a
  href="#agendar"
  class="nav-button"
  (click)="scrollTo('agendar')"
>
  Agendar cita
</a>

    </nav>




  </div>

</header>
